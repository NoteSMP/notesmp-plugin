name: NoteSMP
version: 1.0.4-SNAPSHOT
main: de.notesmp.plugin.NoteSMPPlugin
api-version: '26.3'
description: NoteSMP API heartbeat, player statistics and Discord account verification.
authors: [NoteSMP]
commands:
  notesmp:
    description: NoteSMP plugin utilities.
    usage: /notesmp [help|info|admin help|activitylog on|off|playerdata update|wipe <player>|update|version]
  verify:
    description: Link your Minecraft account to your NoteSMP Discord account.
    usage: /verify <six-digit-code>
    permission: notesmp.verify
  website:
    description: Open the NoteSMP website.
    usage: /website
    permission: notesmp.links
  discord:
    description: Show the NoteSMP Discord invite link.
    usage: /discord
    permission: notesmp.links
  modpack:
    description: Show the configured NoteSMP modpack link.
    usage: /modpack
    permission: notesmp.links
  youtube:
    description: Show the configured NoteSMP YouTube link.
    usage: /youtube
    permission: notesmp.links
  bluemap:
    description: Show the configured NoteSMP BlueMap link.
    usage: /bluemap
    permission: notesmp.links
  donate:
    description: Show the configured NoteSMP donation link.
    usage: /donate
    permission: notesmp.links
permissions:
  notesmp.admin:
    description: Allows viewing the NoteSMP administrator command help.
    default: op
  notesmp.update:
    description: Allows checking and staging NoteSMP plugin updates.
    default: op
  notesmp.verify:
    description: Allows a player to link their Minecraft account.
    default: true
  notesmp.links:
    description: Allows players to view public NoteSMP website links.
    default: true
  notesmp.playerdata:
    description: Allows manually updating or wiping NoteSMP player data in D1.
    default: op
  notesmp.activitylog:
    description: Allows toggling detailed NoteSMP activity logging.
    default: op
