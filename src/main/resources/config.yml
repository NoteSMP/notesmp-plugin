api:
  base-url: "https://notesmp-api.notesmp-de.workers.dev"
  bot-url: "https://notesmp-bot.notesmp-de.workers.dev"
  # Set this to the same MINECRAFT_API_KEY secret used by both Cloudflare Workers.
  key: "CHANGE_ME"

heartbeat:
  interval-seconds: 60

statistics:
  # Poll the API for individual refresh requests; no full automatic stat sync is performed.
  poll-interval-seconds: 5
  # Include material/entity sub-statistics when a player is explicitly refreshed.
  include-substatistics: true

updates:
  # Check GitHub Releases for newer NoteSMP plugin builds.
  enabled: true
  # Default: every six hours. Minimum accepted value: 30 minutes.
  check-interval-minutes: 360

activity-log:
  # Detailed request and synchronization diagnostics; disabled by default.
  enabled: false
