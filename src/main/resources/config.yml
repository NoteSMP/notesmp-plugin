api:
  base-url: "https://notesmp-api.notesmp-de.workers.dev"
  bot-url: "https://notesmp-bot.notesmp-de.workers.dev"
  # Set this to the same MINECRAFT_API_KEY secret used by both Cloudflare Workers.
  key: "CHANGE_ME"

heartbeat:
  interval-seconds: 60

statistics:
  interval-seconds: 300
  # Send every statistic tracked by Paper, including material/entity sub-statistics.
  include-substatistics: true

updates:
  # Check GitHub Releases for newer NoteSMP plugin builds.
  enabled: true
  # Default: every six hours. Minimum accepted value: 30 minutes.
  check-interval-minutes: 360
