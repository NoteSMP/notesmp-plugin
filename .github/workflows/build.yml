name: Build NoteSMP Paper Plugin
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode clean package
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: notesmp-plugin
          path: target/notesmp-plugin-*.jar
