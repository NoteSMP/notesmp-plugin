name: Build NoteSMP Paper Plugin
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set build version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "${GITHUB_EVENT_NAME}" == push && "${GITHUB_REF}" == refs/heads/main ]]; then
            VERSION="1.0.4-dev.12"
          else
            VERSION="1.0.4-dev.12"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mvn --batch-mode versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          sed -i "s/^version: .*/version: $VERSION/" src/main/resources/plugin.yml
      - name: Build plugin
        run: mvn --batch-mode clean package
      - uses: actions/upload-artifact@v4
        with:
          name: notesmp-plugin
          path: target/notesmp-plugin-*.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set build version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PRERELEASE=false
          else
            VERSION="1.0.4-dev.12"
            PRERELEASE=true
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"
          mvn --batch-mode versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          sed -i "s/^version: .*/version: $VERSION/" src/main/resources/plugin.yml
      - name: Build release JAR
        run: mvn --batch-mode clean package
      - name: Publish build to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: NoteSMP Plugin ${{ env.VERSION }}
          prerelease: ${{ env.PRERELEASE }}
          files: target/notesmp-plugin-*.jar
          generate_release_notes: true
